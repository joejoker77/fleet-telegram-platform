# onecli (the egress proxy) logs every proxied request at INFO. With ~40 tenant
# agents polling api.anthropic.com and registry.npmjs.org that is ~1,500 lines a
# minute, ~650MB/day, and it was the whole remaining baseline of /var/log/syslog
# once the audit-collector restart loop was fixed on 2026-10-20.
#
# Dropped before the 50-default.conf rules that write /var/log/syslog, so none of
# it reaches the file. journald still keeps a copy, bounded by SystemMaxUse=500M
# in /etc/systemd/journald.conf.d/90-size.conf — so recent proxy history is still
# there for `journalctl -t onecli` without any of it landing on disk forever.
#
# To silence it at source instead (nothing in journald either) set RUST_LOG on the
# onecli container; that needs the container recreated, which briefly cuts egress
# for every tenant.
if ($programname == "onecli") then {
    stop
}
