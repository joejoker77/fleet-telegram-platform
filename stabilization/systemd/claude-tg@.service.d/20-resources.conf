# M0 stabilization — elastic resource limits (Problem B #3: OOM).
# Additive drop-in for claude-tg@.service. Sized for a 12 GB box with up to
# 8 bots: no single bot can exhaust the host; soft-throttle sits above the
# current observed peak (~0.9 GB) so normal sessions are untouched.
# Tunable — these become per-tenant values in platform.yaml in the target build.
[Service]
MemoryAccounting=true
MemoryHigh=1536M
MemoryMax=2G
# A child (npx/subagent/plugin) hitting the cap must NOT tear the whole bot
# down — the poller-watchdog handles a dead channel. Main-process death still
# triggers Restart=always.
OOMPolicy=continue
# Elastic CPU/IO sharing (target design carries these into claude-pod@).
CPUWeight=100
IOWeight=100
