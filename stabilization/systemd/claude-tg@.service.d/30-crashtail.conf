# M0 stabilization — crash evidence (Problem B: "random restarts").
# On every stop/crash, capture the exit code + a tail of the live session so a
# restart is explainable, not "random". Runs in the service's own user context.
[Service]
ExecStopPost=/usr/local/sbin/claude-tg-crashtail %i $SERVICE_RESULT $EXIT_CODE $EXIT_STATUS
