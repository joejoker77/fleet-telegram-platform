# Keep the firm's automatic OS updates from restarting the tenant fleet.
# Installed as /etc/needrestart/conf.d/90-claude-fleet.conf by
# runtime/install/needrestart-guard.sh.
#
# Why this exists
# ---------------
# 2026-09-23, 06:01 UTC: unattended-upgrades installed libglib2.0 and libexpat1.
# needrestart runs in automatic mode on this host and restarted every service
# linking them — which is all 32 claude-pod@ units and podman-restart.service,
# the unit holding the onecli egress proxy and the cp-* stack. The pods came back
# at 06:01:23, the proxy only at 06:01:34, and claude — which decides once at
# startup whether it has channels — came up with none. 24 of 32 lawyers had a bot
# that collected their messages and answered nothing until a human restarted it.
#
# The restarts bought nothing in the first place. These are CONTAINERS: the
# libraries that were upgraded live on the host, the processes inside the pods run
# against the image's own copies, and bouncing the container does not update
# anything inside it. So the upgrade was pure cost.
#
# What this does NOT do
# ---------------------
# Nothing here touches unattended-upgrades, apt, or which packages get installed.
# The firm's administrators keep updating the OS exactly as before, and needrestart
# keeps restarting everything else it finds. This narrows one list: our own
# containers, which we restart ourselves, deliberately and one at a time.
#
# 0 = never restart automatically, 1 = restart, 2 = ask.
#
# Per-key assignment, NOT `$nrconf{override_rc} = {...}`. Assigning the whole hash
# replaces it, and the defaults it would silently drop are the ones that stop an
# upgrade from restarting dbus and the display managers out from under a running
# system. conf.d fragments are meant to add to the map, so add to it.
$nrconf{override_rc}{qr(^claude-pod@)}    = 0;   # the 32 tenant runtimes
$nrconf{override_rc}{qr(^podman-restart)} = 0;   # holds onecli (egress proxy) + cp-*
$nrconf{override_rc}{qr(^claude-upload)}  = 0;
$nrconf{override_rc}{qr(^cl-egress-)}     = 0;   # the bridge→proxy forwarder
$nrconf{override_rc}{qr(^cp-)}            = 0;   # control-plane units
