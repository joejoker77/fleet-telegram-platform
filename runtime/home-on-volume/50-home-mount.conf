# /home is a bind mount off the ms-claude-vol1 volume since 2026-10-27. Without
# this, a pod starting before that mount is up would bind-mount an EMPTY
# /home/<user>/work and /home/<user>/.claude into the container and the tenant
# would come up with no files, no settings and no channel -- and nothing would
# look broken. RequiresMountsFor makes systemd order the pod after home.mount
# and refuse to start it if the mount is not there, which is the failure we want.
[Unit]
RequiresMountsFor=/home
