# ide.ai-assistant.gg — web-IDE (code-server) behind forward-auth (M5.6).
#
# Install on the Cloudflare origin host (same procedure as the miniapp vhost):
#   cp nginx-ide.conf /etc/nginx/sites-available/ide.ai-assistant.gg
#   ln -s ../sites-available/ide.ai-assistant.gg /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ide.ai-assistant.gg   # 443, like miniapp
#
# How auth works (docs/M5.6-web-ide-design.md): EVERY request — including
# websocket upgrades — passes `auth_request` → cp-api GET /ide/auth, which
# checks the HttpOnly cp_ide cookie (Redis session) and that the session's
# tenant matches X-Ide-Tenant below. code-server itself runs --auth none: the
# ONLY path to its unix socket is this vhost, and this vhost authenticates.
#
# The socket: /run/cp-ide/<user>/ide.sock — bind-mounted into the tenant pod
# (claude-pod-run), never exposed on any network. Pilot = vitaliy only; a later
# tenant gets a copy of this vhost with server_name/tenant/socket swapped.

upstream cp_ide_vitaliy {
    server unix:/run/cp-ide/vitaliy/ide.sock;
}

# ws upgrade mapping. Unique variable name on purpose: the miniapp vhost on the
# same host already defines $connection_upgrade at http level — a same-name map
# here would be a duplicate-variable config error.
map $http_upgrade $ide_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ide.ai-assistant.gg;

    # TLS: run certbot (above) to add the 443 block, matching the miniapp vhost.

    # auth_request subrequest target (internal only — not reachable from outside).
    # Cookies are inherited from the original request; the body is dropped.
    location = /_ide_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/ide/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # This vhost fronts exactly one tenant's IDE; cp-api refuses a session
        # cookie that belongs to anyone else (fail-closed if header missing).
        proxy_set_header X-Ide-Tenant vitaliy;
    }

    # Ticket → cookie login (the URL the Mini App opens). Deliberately the ONLY
    # cp-api endpoint exposed on this origin: /ide/ticket is called via the
    # miniapp origin (Bearer JWT), /ide/auth is internal-only above.
    location = /api/ide/login {
        proxy_pass http://127.0.0.1:8080/ide/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is code-server — gated per-request.
    location / {
        auth_request /_ide_auth;

        proxy_pass http://cp_ide_vitaliy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ide_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding gzip;
        proxy_read_timeout 3600s;   # long-lived websockets (terminal sessions)
        proxy_send_timeout 3600s;
        client_max_body_size 64m;   # file uploads into the IDE
    }
}
