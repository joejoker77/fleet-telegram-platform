# miniapp.ai-assistant.gg — Telegram Mini App (M5) vhost.
#
# Install on the Cloudflare origin host for ai-assistant.gg:
#   cp nginx-miniapp.conf /etc/nginx/sites-available/miniapp.ai-assistant.gg
#   ln -s ../sites-available/miniapp.ai-assistant.gg /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Why this must exist: the DNS record is a CF-proxied wildcard/apex twin; with
# no matching server_name the request falls through to the origin's DEFAULT
# vhost (currently n8n) — observed 2026-06-10. This vhost catches the name.
#
# TLS: terminate with the host's existing wildcard/SAN cert, or run CF
# "Full (strict)" with an origin certificate — match whatever the apex does.

# ws upgrade mapping (http-level; required by the /api/ location below).
# If another vhost on this host already defines it, drop this map.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name miniapp.ai-assistant.gg;

    # Cloudflare connects over HTTP unless origin TLS is configured; if the
    # apex already terminates TLS on 443, mirror that block here instead.

    root /var/www/miniapp/dist;
    index index.html;

    # static SPA — client-side routing falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # control-plane API (cp-api, 127.0.0.1:8080 by default)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        # ws upgrade for /api/live (LiveActivity stream); harmless for plain
        # HTTP requests — $http_upgrade is empty so Connection stays default.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long-lived ws connections (/api/live)
        client_max_body_size 2m;   # fs API caps content at 1 MiB
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
