# auto-suspend-monitor config (M4 / WP6). Loaded as an EnvironmentFile by
# auto-suspend-monitor@.service. Edit + `systemctl daemon-reload` to apply.
WINDOW_MIN=60
THRESHOLD=3
# 0 = alert-only (SAFE DEFAULT — alerts the admin but does NOT pause the pod, so a
#     test/operator action can't freeze the pilot bot's own container).
# 1 = enforce — on threshold, `podman pause claude-<user>` + status=suspended.
#     Flip to 1 once validated (and resume with `tenant-resume <user>`).
ENFORCE=0
